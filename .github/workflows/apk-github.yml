name: APK sur GitHub (sans quota Expo)

# Compile l'APK sur une machine GitHub (« eas build --local ») au lieu des
# serveurs d'Expo : ne consomme pas le quota mensuel de compilations Expo.
# Même clé de signature (récupérée chez Expo), même canal de mises à jour.
# L'APK est publié dans une « Release » GitHub (lien en fin de journal).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Une machine GitHub compile plus lentement que les serveurs d'Expo (1er essai arrêté à 60 min).
    timeout-minutes: 150
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
      # Téléphones Android récents seulement (arm64) : 4 fois moins de code natif à compiler.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps
      - name: Link EAS project
        working-directory: mobile
        run: eas init --non-interactive --force
      - name: Point the app at EAS Update
        working-directory: mobile
        run: node scripts/configure-updates.js
      - name: Build Android APK (preview, sur GitHub)
        working-directory: mobile
        run: eas build --platform android --profile preview --non-interactive --local --output "$GITHUB_WORKSPACE/passerelle.apk"
      - name: Runtime de l'APK
        id: meta
        run: echo "runtime=$(node -p "require('./mobile/app.json').expo.runtimeVersion")" >> "$GITHUB_OUTPUT"
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" passerelle.apk \
            --target "$GITHUB_SHA" \
            --title "Passerelle APK n°${{ github.run_number }} (runtime ${{ steps.meta.outputs.runtime }})" \
            --notes "APK compilé sur GitHub depuis ${GITHUB_SHA::7}. À ouvrir sur le téléphone pour l'installer."
          echo "APK : https://github.com/${{ github.repository }}/releases/download/$TAG/passerelle.apk"
