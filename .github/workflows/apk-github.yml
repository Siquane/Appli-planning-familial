name: APK sur GitHub (sans quota Expo)

# Compile l'APK sur une machine GitHub (« eas build --local ») au lieu des
# serveurs d'Expo : ne consomme pas le quota mensuel de compilations Expo.
# Même clé de signature (récupérée chez Expo), même canal de mises à jour.
# L'APK est publié dans une « Release » GitHub (lien en fin de journal).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Une machine GitHub compile plus lentement que les serveurs d'Expo (1er essai arrêté à 60 min).
    timeout-minutes: 150
    env:
      # La machine GitHub n'a que 7 Go : Gradle limité à 3 Go, 2 tâches à la fois,
      # compilateur Kotlin dans le même processus (le 2e essai s'est arrêté net,
      # sans journal : manque de mémoire).
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dkotlin.compiler.execution.strategy=in-process
      # Téléphones Android récents seulement (arm64) : 4 fois moins de code natif à compiler.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - name: Mémoire d'appoint et place disque
        run: |
          # 3e essai : la machine a lâché après 26 min sans journal (disque ou mémoire).
          # On garde le SDK Android (/usr/local/lib/android), on enlève le reste du superflu.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/heroku /opt/microsoft /opt/google || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          sudo fallocate -l 4G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps
      - name: Link EAS project
        working-directory: mobile
        run: eas init --non-interactive --force
      - name: Point the app at EAS Update
        working-directory: mobile
        run: node scripts/configure-updates.js
      - name: Build Android APK (preview, sur GitHub)
        working-directory: mobile
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # Journal envoyé toutes les 2 min dans une pré-version GitHub « journal-N » :
          # lisible même si la machine s'arrête net (les journaux GitHub sont alors perdus).
          TAG="journal-${{ github.run_number }}"
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Journal compilation n°${{ github.run_number }}" --notes "Suivi en direct de la compilation." || true
          (
            while sleep 120; do
              { date -u; free -h; df -h /; echo; tail -n 300 "$GITHUB_WORKSPACE/build.log"; } > "$GITHUB_WORKSPACE/suivi.txt" 2>&1
              gh release upload "$TAG" "$GITHUB_WORKSPACE/suivi.txt" --clobber > /dev/null 2>&1 || true
            done
          ) &
          eas build --platform android --profile preview --non-interactive --local --output "$GITHUB_WORKSPACE/passerelle.apk" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Garder le journal de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-compilation
          path: build.log
          retention-days: 7
      - name: Runtime de l'APK
        id: meta
        run: echo "runtime=$(node -p "require('./mobile/app.json').expo.runtimeVersion")" >> "$GITHUB_OUTPUT"
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" passerelle.apk \
            --target "$GITHUB_SHA" \
            --title "Passerelle APK n°${{ github.run_number }} (runtime ${{ steps.meta.outputs.runtime }})" \
            --notes "APK compilé sur GitHub depuis ${GITHUB_SHA::7}. À ouvrir sur le téléphone pour l'installer."
          echo "APK : https://github.com/${{ github.repository }}/releases/download/$TAG/passerelle.apk"
